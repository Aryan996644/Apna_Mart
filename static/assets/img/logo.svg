<svg width="170" height="50" viewBox="0 0 170 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fad39" />
      <stop offset="100%" stop-color="#5e8825" />
    </linearGradient>
  </defs>
  
  <!-- Modern Grocery Bag Icon -->
  <g transform="translate(6, 6)">
    <!-- Bag handles -->
    <path d="M12 12 C12 6, 22 6, 22 12" stroke="#7fad39" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Bag body -->
    <rect x="5" y="11" width="24" height="25" rx="5" fill="url(#apnaGrad)" />
    <!-- Fresh Leaf accent on bag -->
    <path d="M17 17 C21 17, 23 21, 23 25 C19 25, 17 21, 17 17 Z" fill="#ffffff" opacity="0.9" />
    <path d="M17 25 C17 21, 13 21, 13 25 C15 25, 17 25, 17 25 Z" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Brand Typography -->
  <!-- "Apna" in rich dark charcoal -->
  <text x="44" y="29" font-family="'Cairo', 'Segoe UI', 'Inter', sans-serif" font-weight="900" font-size="23" fill="#1c1c1c" letter-spacing="-0.5">Apna</text>
  <!-- "Mart" in fresh theme green -->
  <text x="102" y="29" font-family="'Cairo', 'Segoe UI', 'Inter', sans-serif" font-weight="900" font-size="23" fill="#7fad39" letter-spacing="-0.5">Mart</text>
  
  <!-- Tagline -->
  <text x="45" y="42" font-family="'Cairo', 'Segoe UI', 'Inter', sans-serif" font-weight="700" font-size="7.5" fill="#888888" letter-spacing="2.2">FRESH &amp; LOCAL</text>
</svg>
